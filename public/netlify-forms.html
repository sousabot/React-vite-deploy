<!doctype html>
<html>
  <body>
    <!-- Static copies so Netlify detects the forms at deploy time. -->
    <form name="newsletter" method="POST" data-netlify="true" netlify-honeypot="bot-field">
      <input type="hidden" name="form-name" value="newsletter" />
      <input name="bot-field" />
      <input type="email" name="email" />
    </form>

    <form name="work-with-us" method="POST" data-netlify="true">
      <input type="hidden" name="form-name" value="work-with-us" />
      <input name="firstName" />
      <input name="lastName" />
      <input name="age" />
      <textarea name="about"></textarea>
      <textarea name="tournaments"></textarea>
      <input name="discord" />
    </form>
  </body>
</html>
